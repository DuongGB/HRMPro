  # ─── Redis ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hrmpro-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  # ─── MongoDB ──────────────────────────────────
  mongo:
    image: mongo:7
    container_name: hrmpro-mongo
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db

  # ─── MinIO ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: hrmpro-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ─── MailHog (dev email catcher) ──────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: hrmpro-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI — xem email tại http://localhost:8025

