version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hrmpro-postgres
    environment:
      POSTGRES_DB: hrmpro
      POSTGRES_USER: hrmpro
      POSTGRES_PASSWORD: hrmpro123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./references/db-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrmpro"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hrmpro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass hrmpro123

  # ─── MinIO ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: hrmpro-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ─── MailHog (dev email catcher) ──────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: hrmpro-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI — xem email tại http://localhost:8025

  # ─── Spring Boot Backend ──────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrmpro-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hrmpro
      SPRING_DATASOURCE_USERNAME: hrmpro
      SPRING_DATASOURCE_PASSWORD: hrmpro123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: hrmpro123
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025

      # JWT
      APP_JWT_SECRET: "hrmpro-super-secret-key-256-bits-change-in-production!!"
      APP_JWT_EXPIRATION_MS: 900000 # 15 phút
      APP_JWT_REFRESH_EXPIRATION_MS: 604800000 # 7 ngày

      # MinIO
      APP_MINIO_ENDPOINT: http://minio:9000
      APP_MINIO_ACCESS_KEY: minioadmin
      APP_MINIO_SECRET_KEY: minioadmin123
      APP_MINIO_BUCKET_AVATARS: hrmpro-avatars
      APP_MINIO_BUCKET_DOCUMENTS: hrmpro-documents
      APP_MINIO_BUCKET_PAYSLIPS: hrmpro-payslips

      # CORS
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5173"

      # Payroll cron: chạy ngày 25 mỗi tháng
      APP_PAYROLL_CRON: "0 0 8 25 * ?"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # ─── React Frontend ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hrmpro-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
      VITE_APP_NAME: HRMPro
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:

# ─── Useful dev commands ──────────────────────
# docker-compose up -d
# docker-compose logs -f backend
# docker-compose exec postgres psql -U hrmpro -d hrmpro
# Xem email: http://localhost:8025
# MinIO Console: http://localhost:9001 (minioadmin/minioadmin123)
