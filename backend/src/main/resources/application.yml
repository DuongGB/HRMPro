spring:
  config:
    import: optional:file:.env,optional:file:../.env
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      username: ${SPRING_DATA_MONGODB_USERNAME}
      password: ${SPRING_DATA_MONGODB_PASSWORD}
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS}
  minio:
    endpoint: ${APP_MINIO_ENDPOINT}
    access-key: ${APP_MINIO_ACCESS_KEY}
    secret-key: ${APP_MINIO_SECRET_KEY}
    bucket:
      avatars: hrmpro-avatars
      documents: hrmpro-documents
      payslips: hrmpro-payslips
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  payroll:
    cron: ${APP_PAYROLL_CRON}
  audit-log:
    retention-days: ${APP_AUDIT_LOG_RETENTION_DAYS}

logging:
  level:
    org.flywaydb: DEBUG
